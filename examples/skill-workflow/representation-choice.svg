<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#222222" stroke-width="1"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif">
    <text x="88" y="66" fill="#111111" font-size="32" font-weight="600">关系决定表达方式</text>
    <text x="88" y="98" fill="#666666" font-size="16">独立对象用卡片，路径依赖用点线，两者都重要时混合</text>
    <line x1="88" y1="126" x2="1112" y2="126" stroke="#E8E8E8"/>
    <line x1="400" y1="205" x2="400" y2="520" stroke="#E8E8E8" stroke-dasharray="4 8"/>
    <line x1="800" y1="205" x2="800" y2="520" stroke="#E8E8E8" stroke-dasharray="4 8"/>
    <text x="200" y="205" text-anchor="middle" fill="#999999" font-size="12" letter-spacing="2">对象</text>
    <text x="600" y="205" text-anchor="middle" fill="#999999" font-size="12" letter-spacing="2">关系</text>
    <text x="1000" y="205" text-anchor="middle" fill="#999999" font-size="12" letter-spacing="2">混合</text>
    <rect x="112" y="292" width="176" height="104" fill="#F5F5F5" stroke="#222222"/>
    <line x1="112" y1="292" x2="288" y2="292" stroke="#2F6BFF" stroke-width="4"/>
    <text x="200" y="337" text-anchor="middle" fill="#111111" font-size="21" font-weight="600">独立模块</text>
    <text x="200" y="365" text-anchor="middle" fill="#777777" font-size="13">需要边界、便于比较</text>
    <circle cx="510" cy="344" r="7" fill="#2F6BFF"/>
    <circle cx="600" cy="344" r="7" fill="#2F6BFF"/>
    <circle cx="690" cy="344" r="7" fill="#2F6BFF"/>
    <line x1="510" y1="344" x2="690" y2="344" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="600" y="400" text-anchor="middle" fill="#111111" font-size="21" font-weight="600">路径依赖</text>
    <text x="600" y="428" text-anchor="middle" fill="#777777" font-size="13">需要顺序、方向和变化</text>
    <rect x="908" y="292" width="128" height="104" fill="#F5F5F5" stroke="#222222"/>
    <rect x="960" y="320" width="128" height="104" fill="#EAF0FF" stroke="#2F6BFF"/>
    <path d="M288 426 C480 520 760 520 960 426" fill="none" stroke="#B8B8B8"/>
    <circle cx="960" cy="426" r="6" fill="#2F6BFF"/>
    <text x="1000" y="365" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">边界＋关系</text>
    <text x="1000" y="392" text-anchor="middle" fill="#2F6BFF" font-size="13">两者都重要</text>
    <text x="600" y="558" text-anchor="middle" fill="#999999" font-size="14">先判断关系，再选容器；卡片不是禁用项，卡片墙才是问题</text>
  </g>
</svg>
