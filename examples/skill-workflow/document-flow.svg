<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#222222" stroke-width="1"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif">
    <text x="88" y="66" fill="#111111" font-size="32" font-weight="600">画板应该跟着主题走</text>
    <text x="88" y="98" fill="#666666" font-size="16">读到哪一段，就在那一段看到对应的关系图</text>
    <line x1="88" y1="126" x2="1112" y2="126" stroke="#E8E8E8"/>
    <text x="180" y="203" fill="#999999" font-size="12" letter-spacing="2">文档阅读流</text>
    <line x1="260" y1="228" x2="260" y2="516" stroke="#222222"/>
    <line x1="244" y1="260" x2="276" y2="260" stroke="#B8B8B8"/>
    <line x1="244" y1="372" x2="276" y2="372" stroke="#2F6BFF" stroke-width="2"/>
    <line x1="244" y1="484" x2="276" y2="484" stroke="#B8B8B8"/>
    <circle cx="260" cy="372" r="7" fill="#2F6BFF"/>
    <text x="300" y="266" fill="#111111" font-size="20" font-weight="600">背景</text>
    <text x="300" y="291" fill="#777777" font-size="13">先交代来龙去脉</text>
    <text x="300" y="378" fill="#111111" font-size="20" font-weight="600">主题</text>
    <text x="300" y="403" fill="#2F6BFF" font-size="13">画板插在这里</text>
    <text x="300" y="490" fill="#111111" font-size="20" font-weight="600">细节</text>
    <text x="300" y="515" fill="#777777" font-size="13">证据、例子和链接</text>
    <path d="M420 372 C520 285 600 285 700 342" fill="none" stroke="#2F6BFF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M420 372 C520 459 600 459 700 402" fill="none" stroke="#B8B8B8" stroke-width="1"/>
    <rect x="700" y="310" width="250" height="124" fill="#F5F5F5" stroke="#222222"/>
    <line x1="700" y1="310" x2="950" y2="310" stroke="#2F6BFF" stroke-width="4"/>
    <text x="825" y="362" text-anchor="middle" fill="#111111" font-size="22" font-weight="600">对应画板</text>
    <text x="825" y="391" text-anchor="middle" fill="#777777" font-size="13">解释当前主题的关系</text>
    <text x="825" y="550" text-anchor="middle" fill="#999999" font-size="14">章节标题 → 画板 → 背景与证据</text>
  </g>
</svg>
