    <text x="88" y="98" fill="#666666" font-size="16">技术读者看深度，非技术读者先看判断、边界和下一步</text>
    <line x1="88" y1="126" x2="1112" y2="126" stroke="#E8E8E8"/>
    <rect x="116" y="292" width="184" height="82" fill="#F5F5F5" stroke="#B8B8B8"/>
    <text x="208" y="326" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">技术内容</text>
    <text x="208" y="351" text-anchor="middle" fill="#777777" font-size="13">机制、数据、术语</text>
    <rect x="116" y="404" width="184" height="82" fill="#F5F5F5" stroke="#B8B8B8"/>
    <text x="208" y="438" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">业务问题</text>
    <text x="208" y="463" text-anchor="middle" fill="#777777" font-size="13">目标、风险、结果</text>
    <path d="M300 333 C410 260 490 260 560 348" fill="none" stroke="#222222" marker-end="url(#arrow)"/>
    <path d="M300 445 C410 518 490 518 560 412" fill="none" stroke="#222222" marker-end="url(#arrow)"/>
    <circle cx="600" cy="380" r="66" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1.5"/>
    <circle cx="600" cy="380" r="7" fill="#2F6BFF"/>
    <text x="600" y="375" text-anchor="middle" fill="#111111" font-size="21" font-weight="600">共同语言</text>
    <text x="600" y="402" text-anchor="middle" fill="#777777" font-size="13">先说人话</text>
    <path d="M666 348 C745 280 820 280 900 334" fill="none" stroke="#222222" marker-end="url(#arrow)"/>
    <path d="M666 412 C745 480 820 480 900 426" fill="none" stroke="#222222" marker-end="url(#arrow)"/>
    <rect x="900" y="292" width="184" height="82" fill="#F5F5F5" stroke="#222222"/>
    <text x="992" y="326" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">判断标准</text>
    <text x="992" y="351" text-anchor="middle" fill="#777777" font-size="13">知道什么算做好</text>
    <rect x="900" y="404" width="184" height="82" fill="#EAF0FF" stroke="#2F6BFF"/>
    <text x="992" y="438" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">下一步</text>
    <text x="992" y="463" text-anchor="middle" fill="#2F6BFF" font-size="13">知道现在做什么</text>
    <text x="600" y="556" text-anchor="middle" fill="#999999" font-size="14">先让不同背景的人站到同一张图上</text>
  </g>
